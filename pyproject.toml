[project]
name = "dex-tactile"
version = "0.1.0"
description = "Python utilities for the Inspire dexterous tactile hand project."
requires-python = ">=3.11"
dependencies = [
    "blosc>=1.11.4",
    "fastapi>=0.139.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.4",
    "mediapipe==0.10.14",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pymodbus==2.5.3",
    "pyyaml>=6.0.3",
    "pyzmq>=27.1.0",
    "uvicorn[standard]>=0.51.0",
    "websockets>=15.0",
    "dex_retargeting",
]

[tool.uv.sources]
dex_retargeting = { path = "dex-retargeting", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "inspire_doc",
]

[tool.pytest.ini_options]
testpaths = ["inspire_visualizer/backend/tests", "hand_data_collection/tests", "scripts/tests", "unified_web/tests"]
pythonpath = [".", "dex-retargeting", "inspire_visualizer/backend/src", "Open-Teach"]

[tool.pyright]
extraPaths = ["dex-retargeting", "inspire_visualizer/backend/src", "Open-Teach"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = [
    "hand_data_collection/*.py",
    "inspire_visualizer/backend/src",
    "unified_web/*.py",
    "dex-retargeting/viewer/backend",
    "dex-retargeting/src/dex_retargeting/inspire_retargeting.py",
    "Open-Teach/openteach/robot/inspire",
    "Open-Teach/openteach/components/operators/inspire.py",
]
exclude = [
    "**/__pycache__",
    "**/tests",
]
